spring:
  application:
    name: pedidos-api
  threads:
    virtual:
      enabled: true

server:
  port: 8080
  shutdown: graceful
  servlet:
    context-path: /

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
    metrics:
      enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true

  # OpenTelemetry Configuration
  tracing:
    sampling:
      probability: 1.0  # Sample 100% of traces (adjust for production)
    export:
      otlp:
        enabled: false  # Disable OTLP exporter (not using Jaeger/Tempo in V1)

  # Prometheus Metrics
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${app.environment:dev}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        orders.create.duration: true

logging:
  level:
    root: INFO
    com.robertosrjr.pedidos: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

app:
  simulation:
    customer-validation-delay-ms: 150
    shipping-calculation-delay-ms: 200
    shipping-base-cost: 10.00

  # Observability - Prometheus Push Gateway (V1 - Development)
  observability:
    pushgateway:
      enabled: true  # Enable push to Prometheus
      url: http://ec2-56-125-131-185.sa-east-1.compute.amazonaws.com:9091  # Pushgateway URL (ECS)
      push-interval-ms: 20000  # Push every 60 seconds