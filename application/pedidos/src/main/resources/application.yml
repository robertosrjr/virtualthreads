spring:
  application:
    name: pedidos-api
  threads:
    virtual:
      enabled: true

server:
  port: 8080
  shutdown: graceful
  servlet:
    context-path: /

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,env
      base-path: /actuator
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
    metrics:
      enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true

  # OpenTelemetry / Jaeger Tracing
  tracing:
    sampling:
      probability: 1.0  # Sample 100% of traces (adjust for production: 0.1 = 10%)
    propagation:
      type: w3c  # W3C Trace Context for interoperability
    export:
      otlp:
        enabled: true  # Enable OTLP exporter to Jaeger
        endpoint: http://ec2-54-232-1-143.sa-east-1.compute.amazonaws.com:4318/v1/traces  # Jaeger OTLP HTTP
        headers:
          Authorization: ""  # Add if Jaeger requires auth
    observations:
      http:
        server:
          enabled: true  # Trace incoming HTTP requests
        client:
          enabled: true  # Trace outgoing HTTP calls

  # Prometheus Metrics
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${app.environment:dev}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        orders.create.duration: true

logging:
  level:
    root: INFO
    com.robertosrjr.pedidos: DEBUG
    io.opentelemetry: WARN  # Suppress verbose OTel logs
  pattern:
    # Include trace ID and span ID for correlation with Jaeger
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{traceId}/%X{spanId}] %-5level %logger{36} - %msg%n"

app:
  simulation:
    customer-validation-delay-ms: 150
    shipping-calculation-delay-ms: 200
    shipping-base-cost: 10.00

  # Observability - Prometheus Push Gateway (V1 - Development)
  observability:
    pushgateway:
      enabled: true  # Enable push to Prometheus
      url: http://ec2-54-232-1-143.sa-east-1.compute.amazonaws.com:9091  # Pushgateway URL (ECS)
      push-interval-ms: 20000  # Push every 60 seconds