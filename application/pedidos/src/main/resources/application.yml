spring:
  application:
    name: pedidos-api
  threads:
    virtual:
      enabled: true
  config:
    # Endereços da infraestrutura por ambiente: copie .env.example para .env (fora do git)
    import: optional:file:.env[.properties]

server:
  port: 8080
  shutdown: graceful
  servlet:
    context-path: /

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true

  # OpenTelemetry / Jaeger Tracing
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}  # 1.0 = 100% (dev); use 0.1 em produção
    propagation:
      type: w3c
    export:
      otlp:
        enabled: ${OTLP_TRACING_ENABLED:false}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}

  # Métricas seguem pelo Pushgateway; o export OTLP de métricas do starter OpenTelemetry fica desligado
  otlp:
    metrics:
      export:
        enabled: ${OTLP_METRICS_ENABLED:false}

  # Prometheus: scrape em /actuator/prometheus e push nativo ao Pushgateway da stack SRE
  prometheus:
    metrics:
      export:
        pushgateway:
          enabled: ${PUSHGATEWAY_ENABLED:false}
          address: ${PUSHGATEWAY_ADDRESS:localhost:9091}
          job: pedidos-api
          push-rate: ${PUSHGATEWAY_PUSH_RATE:20s}
          grouping-key:
            instance: ${PUSHGATEWAY_INSTANCE:local}

  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${app.environment:dev}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        orders.create.duration: true

logging:
  structured:
    format:
      console: ecs  # JSON no padrão Elastic Common Schema; inclui traceId/spanId do MDC
  level:
    root: INFO
    com.robertosrjr.pedidos: ${APP_LOG_LEVEL:INFO}
    io.opentelemetry: WARN

app:
  dependencies:
    timeout: ${APP_DEPENDENCIES_TIMEOUT:2s}  # limite por chamada às portas de saída (validação de cliente, frete)
  simulation:
    customer-validation-delay-ms: 150
    shipping-calculation-delay-ms: 200
    shipping-base-cost: 10.00
